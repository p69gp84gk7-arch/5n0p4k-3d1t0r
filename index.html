<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Superbagnères, remonter le temps</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6ec; --panel:rgba(247,250,252,.92); --ink:#14212c; --muted:#56687a;
  --line:#b7c4cf; --accent:#1f6fd1; --accent-ink:#ffffff; --track:#c9d4dd;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1820; --panel:rgba(18,29,39,.9); --ink:#e7eef4; --muted:#93a6b7;
    --line:#2f4252; --accent:#4b93ef; --accent-ink:#06121e; --track:#2a3b4a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1820; --panel:rgba(18,29,39,.9); --ink:#e7eef4; --muted:#93a6b7;
  --line:#2f4252; --accent:#4b93ef; --accent-ink:#06121e; --track:#2a3b4a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.app{position:relative;height:100%;display:flex;flex-direction:column}

/* --- carte --- */
.view{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:grab;background:#0b1117}
.view.dragging{cursor:grabbing}
.layer{position:absolute;inset:0;overflow:hidden}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.stage img{position:absolute;left:0;top:0;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none;display:block}
.stage img.plan{z-index:5;opacity:0;transition:opacity .25s}
.show-plan .stage img.plan{opacity:.6}

/* rideau */
.curtain{position:absolute;top:0;bottom:0;width:0;display:none;z-index:5}
.compare .curtain{display:block}
.curtain::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.grip{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;
  background:#fff;color:#14212c;border:0;display:grid;place-items:center;cursor:ew-resize;box-shadow:0 2px 10px rgba(0,0,0,.35);font:600 15px Barlow,sans-serif}
.tag{position:absolute;top:12px;z-index:4;font:700 15px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em;
  background:rgba(10,18,26,.72);color:#fff;padding:6px 9px;border-radius:4px;display:none}
.compare .tag{display:block}
.tag.left{left:12px}.tag.right{right:12px}

/* --- titre --- */
.title{position:absolute;left:12px;top:12px;z-index:6;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:8px;padding:10px 14px 12px;max-width:min(340px,calc(100% - 24px))}
.compare .title{top:auto;bottom:40px}
.title h1{margin:0;font:700 22px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.01em}
.title p{margin:4px 0 0;font-size:13px;line-height:1.35;color:var(--muted)}

/* zoom */
.zoom{position:absolute;right:12px;bottom:12px;z-index:6;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 20px/1 Barlow,sans-serif;cursor:pointer}
.zoom button:focus-visible,.seg button:focus-visible,.grip:focus-visible,.check:focus-within{outline:3px solid var(--accent);outline-offset:2px}

/* --- frise --- */
.bar{position:relative;z-index:7;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px 14px;
  display:grid;grid-template-columns:auto 1fr auto;gap:6px 22px;align-items:center}
.year{font:700 54px/0.9 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:-.01em;min-width:4.3ch;font-variant-numeric:tabular-nums}
.year small{display:block;font:500 13px/1.3 Barlow,sans-serif;color:var(--muted);letter-spacing:0;margin-top:4px;max-width:20ch}
.timeline{position:relative;padding:4px 0 26px}
.timeline input{width:100%;margin:0;appearance:none;-webkit-appearance:none;background:transparent;height:34px;cursor:pointer}
.timeline input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--track)}
.timeline input::-moz-range-track{height:6px;border-radius:3px;background:var(--track)}
.timeline input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);margin-top:-10px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.timeline input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--panel)}
.timeline input:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:6px}
.ticks{position:absolute;left:13px;right:13px;bottom:0;height:24px;pointer-events:none}
.ticks button{position:absolute;transform:translateX(-50%);bottom:0;background:none;border:0;padding:2px 3px;color:var(--muted);
  font:600 12px/1 "Barlow Condensed",sans-serif;cursor:pointer;pointer-events:auto;white-space:nowrap}
.ticks button::before{content:"";position:absolute;left:50%;top:-9px;width:1px;height:6px;background:var(--line)}
.ticks button.on{color:var(--ink)}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:600 14px Barlow,sans-serif;padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.check{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.play{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px 12px;font:600 14px Barlow,sans-serif;cursor:pointer}

.credit{position:absolute;right:62px;bottom:12px;z-index:6;font-size:11px;color:#fff;text-shadow:0 1px 2px #000}

@media (max-width:720px){
  .bar{grid-template-columns:auto 1fr;padding:10px 12px 12px}
  .side{grid-column:1 / -1;flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .year{font-size:40px}
  .year small{font-size:12px}
  .ticks button{font-size:11px}
  .ticks button.minor{display:none}
  .title h1{font-size:19px}
  .title p{display:none}
  .credit{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#map{position:absolute;inset:0}
.view{cursor:auto}
.leaflet-container{font-family:Barlow,"Segoe UI",system-ui,sans-serif;background:#0b1117}
.leaflet-control-scale-line{background:var(--panel);color:var(--ink);border-color:var(--ink)}
.leaflet-control-attribution{font-size:10px}
.curtain{z-index:650}
.tag{z-index:640}
.title,.zoom{z-index:700}
.zoom{bottom:28px}
.tag.right select{font:700 15px/1 "Barlow Condensed",sans-serif;background:transparent;color:#fff;border:0;padding:0;cursor:pointer}
.tag.right select option{color:#14212c}
.zlevel{position:absolute;left:12px;bottom:40px;z-index:700;font-size:12px;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
.compare .zlevel{display:none}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="view" id="view">
    <div id="map" aria-label="Carte de Superbagnères"></div>
    <div class="curtain" id="curtain"><button class="grip" id="grip" aria-label="Déplacer le rideau de comparaison">⇆</button></div>
    <span class="tag left" id="tagLeft"></span>
    <span class="tag right"><select id="ref" aria-label="Année affichée à droite du rideau"></select></span>
    <div class="title">
      <h1>Superbagnères, remonter le temps</h1>
      <p>Faites glisser le curseur pour remonter des années 50 jusqu’à 2025. Zoomez pour voir le détail : les images se chargent au fur et à mesure.</p>
    </div>
    <div class="zoom">
      <button id="zin" aria-label="Zoomer">+</button>
      <button id="zout" aria-label="Dézoomer">−</button>
      <button id="zreset" aria-label="Revoir tout le domaine" style="font-size:15px">⤢</button>
    </div>
    <div class="zlevel" id="zlevel"></div>
  </div>
  <div class="bar">
    <div class="year" id="year" aria-live="polite">2025<small>Satellite</small></div>
    <div class="timeline">
      <input type="range" id="slider" min="0" max="10" step="1" value="10" aria-label="Année affichée">
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="side">
      <div class="seg" role="group" aria-label="Mode d’affichage">
        <button id="mScroll" aria-pressed="true">Défiler</button>
        <button id="mCompare" aria-pressed="false">Comparer</button>
      </div>
      <button class="play" id="play">▶ Lecture</button>
      <label class="check"><input type="checkbox" id="fondu"> Fondu entre les années</label>
      <label class="check"><input type="checkbox" id="plan"> Superposer la carte IGN</label>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const WMTS = (layer, fmt, style='normal') =>
  `https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${layer}&STYLE=${style}&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=${fmt}`;

const LAYERS = [
  {k:"1950–65", y:"1950–65", d:"Noir et blanc", id:"ORTHOIMAGERY.ORTHOPHOTOS.1950-1965", f:"image/png",  max:18, st:"BDORTHOHISTORIQUE"},
  {k:"1965–80", y:"1965–80", d:"Noir et blanc", id:"ORTHOIMAGERY.ORTHOPHOTOS.1965-1980", f:"image/png",  max:18, st:"BDORTHOHISTORIQUE"},
  {k:"2002",    y:"2002",    d:"Photo d’avion", id:"ORTHOIMAGERY.ORTHOPHOTOS2002",       f:"image/jpeg", max:18},
  {k:"2006",    y:"2006",    d:"Photo d’avion", id:"ORTHOIMAGERY.ORTHOPHOTOS2006",       f:"image/jpeg", max:18},
  {k:"2010",    y:"2010",    d:"Photo d’avion", id:"ORTHOIMAGERY.ORTHOPHOTOS2010",       f:"image/jpeg", max:18},
  {k:"2013",    y:"2013",    d:"Photo d’avion", id:"ORTHOIMAGERY.ORTHOPHOTOS2013",       f:"image/jpeg", max:18},
  {k:"2016",    y:"2016",    d:"Photo d’avion", id:"ORTHOIMAGERY.ORTHOPHOTOS2016",       f:"image/jpeg", max:18},
  {k:"2019",    y:"2019",    d:"Photo d’avion", id:"ORTHOIMAGERY.ORTHOPHOTOS2019",       f:"image/jpeg", max:18},
  {k:"2022",    y:"2022",    d:"Photo d’avion", id:"ORTHOIMAGERY.ORTHOPHOTOS2022",       f:"image/jpeg", max:19},
  {k:"2025a",   y:"2025",    d:"Photo d’avion", id:"ORTHOIMAGERY.ORTHOPHOTOS.ORTHO-EXPRESS.2025", f:"image/jpeg", max:19},
  {k:"2025s",   y:"2025",    d:"Satellite",     id:"ORTHOIMAGERY.ORTHO-SAT.SPOT.2025",   f:"image/jpeg", max:17}
];
/* Années recalées à partir des photos IGN brutes : annees.json liste les dates
   prévues ; seules celles dont le dossier tiles/<date>/ est publié sont ajoutées
   à la frise, par ordre chronologique. */
const ZONE_TUILES = [[42.745, 0.515], [42.810, 0.615]];
const debut = l => parseInt(l.y, 10);
let N = LAYERS.length, LAST = N-1;
const $ = id => document.getElementById(id);
const app=$('app'), slider=$('slider'), ticks=$('ticks'), yearEl=$('year');

/* ---------- carte ---------- */
const HOME = {center:[42.7625, 0.5600], zoom:15};
const map = L.map('map', {
  center: HOME.center, zoom: HOME.zoom, minZoom: 12, maxZoom: 20,
  zoomControl: false, keyboard: false, zoomSnap: 0.5, wheelPxPerZoomLevel: 90,
  maxBounds: [[42.65, 0.40], [42.87, 0.70]], maxBoundsViscosity: 0.8,
  attributionControl: true
});
map.attributionControl.setPrefix(false).addAttribution('Images © IGN – Géoplateforme');
L.control.scale({imperial:false, position:'bottomleft'}).addTo(map);

map.createPane('fond'); map.getPane('fond').style.zIndex = 150;
map.createPane('base'); map.getPane('base').style.zIndex = 200;
map.createPane('past'); map.getPane('past').style.zIndex = 300;
map.createPane('plan'); map.getPane('plan').style.zIndex = 450;
map.getPane('plan').style.pointerEvents = 'none';

const opts = (l, pane) => ({pane, maxNativeZoom:l.max, maxZoom:20, tileSize:256, keepBuffer:3,
  updateWhenZooming:false, crossOrigin:true, errorTileUrl:'data:image/gif;base64,R0lGODlhAQABAAAAACw=',
  ...(l.tuiles ? {minNativeZoom:13, bounds:ZONE_TUILES} : {})});
const url = l => l.tuiles ? `${l.tuiles}/{z}/{x}/{y}.webp` : WMTS(l.id, l.f, l.st);
const parCle = k => LAYERS.find(l => l.k===k);
let past = [];
const refLayers = {};   // couches affichées à droite du rideau, créées à la demande
const nom = l => l.k==="2025a" ? "2025 · avion" : l.k==="2025s" ? "2025 · satellite"
  : l.tuiles ? `${l.y} · photos recalées` : `${l.y} · ${l.d.toLowerCase()}`;
const plan = L.tileLayer(WMTS("GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2","image/png"),
  {pane:'plan', maxNativeZoom:19, maxZoom:20, opacity:.6});
/* fond de carte topographique IGN (relief, courbes de niveau, chemins) : visible
   là où une année recalée n'a pas de photo vérifiée */
L.tileLayer(WMTS("GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2","image/png"),
  {pane:'fond', maxNativeZoom:19, maxZoom:20, keepBuffer:3, crossOrigin:true}).addTo(map);

/* ---------- frise ---------- */
let compare=false;
function buildTicks(){
  ticks.innerHTML='';
  const max = LAST;
  LAYERS.forEach((l,i)=>{
    const b=document.createElement('button');
    b.textContent = l.k==="2025a" ? "2025 avion" : l.k==="2025s" ? "satellite" : l.y;
    if(i%2===1 && i!==max) b.classList.add('minor');
    b.style.left=(i/max*100)+'%'; b.dataset.i=i;
    b.onclick=()=>{ stopPlay(); slider.value=i; render(); };
    ticks.appendChild(b);
  });
}

/* fondu entre les années : au choix (case à cocher), retenu par le navigateur */
let fondu=false;
try{ fondu = localStorage.getItem('fondu')==='1'; }catch(e){}
$('fondu').checked = fondu;
function setFondu(f){
  fondu=f; stopPlay();
  try{ localStorage.setItem('fondu', f?'1':'0'); }catch(e){}
  slider.step = f ? '0.01' : '1';
  if(!f) slider.value = Math.round(+slider.value);
  render();
}
$('fondu').onchange=e=>setFondu(e.target.checked);

function render(){
  // sans fondu : une seule année visible ; avec fondu : l'année suivante apparaît
  // progressivement. Les voisines restent chargées pour un passage immédiat.
  const v=+slider.value, i=fondu ? Math.floor(v) : Math.round(v), f=fondu ? v-i : 0;
  past.forEach((layer,j)=>{
    const keep = j>=i-1 && j<=i+2;
    if(keep && !map.hasLayer(layer)) layer.addTo(map);
    if(!keep && map.hasLayer(layer)) map.removeLayer(layer);
    if(keep) layer.setOpacity(j===i ? 1 : (j===i+1 ? f : 0));
  });
  const n=Math.round(v), Ly=LAYERS[n];
  yearEl.firstChild.nodeValue = Ly.y;
  yearEl.querySelector('small').textContent = Ly.d;
  $('tagLeft').textContent = Ly.y + (Ly.k==="2025a" ? " · avion" : "");
  ticks.querySelectorAll('button').forEach(b=>b.classList.toggle('on', +b.dataset.i===n));
}
slider.addEventListener('input', ()=>{ stopPlay(); render(); });

/* ---------- comparer ---------- */
let cx=.5;
function setRef(){
  const k = $('ref').value;
  if(compare && k && !refLayers[k]){
    const l = parCle(k);
    refLayers[k] = L.tileLayer(url(l), opts(l,'base'));
  }
  Object.entries(refLayers).forEach(([cle,l])=>{
    const on = compare && cle===k;
    if(on && !map.hasLayer(l)) l.addTo(map);
    if(!on && map.hasLayer(l)) map.removeLayer(l);
  });
}
function buildRef(){
  // toutes les années au choix à droite du rideau ; 2025 satellite par défaut
  const sel = $('ref'), avant = sel.value || "2025s";
  sel.innerHTML = '';
  LAYERS.forEach(l => sel.add(new Option(nom(l), l.k)));
  sel.value = parCle(avant) ? avant : "2025s";
}
function clip(){
  const pane = map.getPane('past');
  const w = map.getSize().x, x = cx*w;
  $('curtain').style.left = x+'px';
  if(!compare){ pane.style.clipPath='none'; return; }
  const nw = map.containerPointToLayerPoint([0,0]);
  const se = map.containerPointToLayerPoint(map.getSize());
  const c  = map.containerPointToLayerPoint([x,0]).x;
  pane.style.clipPath = `polygon(${nw.x}px ${nw.y}px, ${c}px ${nw.y}px, ${c}px ${se.y}px, ${nw.x}px ${se.y}px)`;
}
map.on('move zoom resize', clip);
function setMode(c){
  compare=c; app.classList.toggle('compare',c);
  $('mScroll').setAttribute('aria-pressed',!c); $('mCompare').setAttribute('aria-pressed',c);
  // à gauche du rideau : l'année du curseur (on part de la plus ancienne)
  if(c && +slider.value===LAST) slider.value = 0;
  buildTicks(); setRef(); render(); clip();
}
$('mScroll').onclick=()=>setMode(false);
$('mCompare').onclick=()=>{ stopPlay(); setMode(true); };
$('ref').onchange=setRef;

const grip=$('grip');
L.DomEvent.disableClickPropagation($('curtain'));
grip.addEventListener('pointerdown',e=>{
  e.preventDefault(); e.stopPropagation(); grip.setPointerCapture(e.pointerId); map.dragging.disable();
  const move=ev=>{ const r=$('view').getBoundingClientRect(); cx=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)); clip(); };
  const up=()=>{ grip.removeEventListener('pointermove',move); grip.removeEventListener('pointerup',up); map.dragging.enable(); };
  grip.addEventListener('pointermove',move); grip.addEventListener('pointerup',up);
});
grip.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){cx=Math.max(0,cx-.03);clip();e.preventDefault();e.stopPropagation();}
  if(e.key==='ArrowRight'){cx=Math.min(1,cx+.03);clip();e.preventDefault();e.stopPropagation();}
});
['tagLeft'].forEach(id=>L.DomEvent.disableClickPropagation($(id)));
L.DomEvent.disableClickPropagation(document.querySelector('.tag.right'));
L.DomEvent.disableClickPropagation(document.querySelector('.zoom'));
L.DomEvent.disableScrollPropagation(document.querySelector('.title'));

/* ---------- carte IGN ---------- */
$('plan').onchange=e=> e.target.checked ? plan.addTo(map) : map.removeLayer(plan);

/* ---------- zoom ---------- */
$('zin').onclick=()=>map.zoomIn(1);
$('zout').onclick=()=>map.zoomOut(1);
$('zreset').onclick=()=>map.setView(HOME.center, HOME.zoom);
function showScale(){
  const z=map.getZoom(), lat=map.getCenter().lat;
  const mpp = 156543.03*Math.cos(lat*Math.PI/180)/Math.pow(2,z);
  const v=+slider.value, l=LAYERS[Math.round(v)];
  const native = 156543.03*Math.cos(lat*Math.PI/180)/Math.pow(2,l.max);
  $('zlevel').textContent = mpp < native*0.9 ? 'Détail maximum de cette année atteint' : '';
}
map.on('zoomend', showScale); slider.addEventListener('input', showScale);

/* ---------- lecture auto ----------
   sans fondu : une année toutes les 2 secondes ; avec fondu : glissement progressif
   (pause sur chaque année, puis fondu vers la suivante) */
let minuterie=null, raf=null, last=0;
function stopPlay(){
  if(minuterie){clearInterval(minuterie);minuterie=null;}
  if(raf){cancelAnimationFrame(raf);raf=null;}
  $('play').textContent='▶ Lecture';
}
$('play').onclick=()=>{
  if(minuterie||raf){stopPlay();return;}
  if(+slider.value>=+slider.max) { slider.value=0; render(); }
  $('play').textContent='❚❚ Pause';
  if(!fondu){
    minuterie=setInterval(()=>{
      slider.value=Math.min(+slider.max, Math.round(+slider.value)+1); render(); showScale();
      if(+slider.value>=+slider.max) stopPlay();
    }, 2000);
    return;
  }
  last=performance.now();
  const step=t=>{
    const dt=(t-last)/1000; last=t;
    const v=+slider.value, frac=v-Math.floor(v);
    const speed = frac<0.02||frac>0.98 ? 0.35 : 0.9;
    const nv=Math.min(+slider.max, v+dt*speed);
    slider.value=nv; render();
    if(nv>=+slider.max){stopPlay();return;}
    raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
};

/* flèches du clavier = années */
document.addEventListener('keydown',e=>{
  if(e.target===slider||e.target===grip||e.target.tagName==='SELECT') return;
  if(e.key==='ArrowLeft'){stopPlay();slider.value=Math.max(0,Math.round(+slider.value)-1);render();}
  if(e.key==='ArrowRight'){stopPlay();slider.value=Math.min(+slider.max,Math.round(+slider.value)+1);render();}
});

async function demarrer(){
  try{
    const r = await fetch('annees.json', {cache:'no-cache'});
    if(r.ok){
      const prevues = await r.json();
      const publiees = await Promise.all(prevues.map(a =>
        fetch(`tiles/${a.date}/info.json`, {method:'HEAD', cache:'no-cache'}).then(x => x.ok, () => false)));
      const annees = prevues.filter((a, i) => publiees[i]);
      // zoom maximal publié pour chaque date (17 ou 18, selon la finesse des photos)
      await Promise.all(annees.map(a => fetch(`tiles/${a.date}/info.json`, {cache:'no-cache'})
        .then(x => x.json()).then(i => { a.max = i.max || 18; }, () => { a.max = 18; })));
      // les références 2025 restent en fin de frise ; les autres couches sont triées par année
      const refs = LAYERS.filter(l => l.k.startsWith('2025'));
      const autres = LAYERS.filter(l => !l.k.startsWith('2025'));
      annees.forEach(a => autres.push({k:a.date, y:a.annee, d:a.description, tuiles:`tiles/${a.date}`, max:a.max}));
      autres.sort((a,b) => debut(a)-debut(b));
      LAYERS.splice(0, LAYERS.length, ...autres, ...refs);
    }
  }catch(e){ /* pas de liste : on garde les seules couches IGN */ }
  N = LAYERS.length; LAST = N-1;
  past = LAYERS.map((l,j) => L.tileLayer(url(l), opts(l,'past')).setZIndex(j));
  slider.max = LAST; slider.step = fondu ? '0.01' : '1'; slider.value = LAST;
  buildRef(); buildTicks(); render(); clip(); showScale();
}
demarrer();

</script>
